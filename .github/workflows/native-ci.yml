name: Native server and TWS integration
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libasio-dev libboost-system-dev libsqlite3-dev protobuf-compiler libprotobuf-dev libintelrdfpmath-dev
      - name: Download pinned official SDK (not redistributed)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 https://interactivebrokers.github.io/downloads/twsapi_macunix.1045.01.zip -o "$RUNNER_TEMP/ibapi.zip"
          echo '56ea048911052e86d6621ab712957c790fce6d547bc2a55900136ae4f6835941  '"$RUNNER_TEMP/ibapi.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ibapi.zip" -d "$RUNNER_TEMP/ibapi"
      - name: Verify depth callback declarations in pinned SDK
        run: grep -i 'Depth.*ProtoBuf\|updateMktDepth' "$RUNNER_TEMP/ibapi/IBJts/source/cppclient/client/EWrapper_prototypes.h"
      - name: Configure full native build
        run: cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDTS_BUILD_SERVER=ON -DDTS_WITH_IBKR=ON -DIBKR_API_ROOT="$RUNNER_TEMP/ibapi/IBJts"
      - name: Build SDK, adapter and server
        run: cmake --build build-native --parallel 2
      - name: Test (no real broker or credentials)
        run: ctest --test-dir build-native --output-on-failure
