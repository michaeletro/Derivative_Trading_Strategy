name: Pricing lab
on:
  push:
    branches: [feature/pricing-simulation-lab, feature/greeks-scenario-lab, feature/persistent-timeseries, feature/historical-data-manager, feature/replay-research-lab, feature/sde-discretization-lab, feature/hedging-replication-lab]
  pull_request:
permissions:
  contents: read
concurrency:
  group: pricing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source snapshot (no vendor SDK, secrets, or runtime data)
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/research-source.tar.gz" HEAD CMakeLists.txt cmake apps tests docs README.md SECURITY.md .github .gitignore .env.example requirements-dev.txt src/frontend/dashboard src/backend/cpp_src/core src/backend/cpp_src/http src/backend/cpp_src/src/Utilities/server.cpp src/backend/cpp_src/src/main.cpp src/backend/cpp_src/headers/Utilities/crow_all.h src/backend/cpp_src/headers/Utilities/server.h src/backend/cpp_src/pricing src/backend/cpp_src/storage src/backend/cpp_src/research src/backend/cpp_src/ibkr tools/start_dashboard.py tools/restore_timeseries.py tools/local_config.py tools/configure_dashboard.py tools/open_dashboard.py tools/depth_capture.py research/liquidity_aware_hedging
      - uses: actions/upload-artifact@v4
        with:
          name: research-source
          path: ${{ runner.temp }}/research-source.tar.gz
          retention-days: 3
      - name: Install HTTP dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libasio-dev libboost-system-dev libsqlite3-dev
      - name: Build research server without a broker SDK
        run: |
          cmake -S . -B build-pricing -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDTS_BUILD_SERVER=ON -DDTS_WITH_IBKR=OFF
          cmake --build build-pricing --parallel 2
          ctest --test-dir build-pricing --output-on-failure
      - name: Execute synthetic Phase I notebook (no credentials or market data)
        run: |
          python -m pip install -r research/liquidity_aware_hedging/requirements.txt
          python tests/depth/notebook_test.py --output "$RUNNER_TEMP/phase1-synthetic.ipynb"
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-synthetic-notebook
          path: ${{ runner.temp }}/phase1-synthetic.ipynb
          retention-days: 7
      - name: Frontend rules
        run: node --test tests/dashboard/model.test.mjs tests/pricing/model.test.mjs tests/greeks/model.test.mjs tests/storage/model.test.mjs tests/history/model.test.mjs tests/replay/model.test.mjs tests/sde/model.test.mjs tests/hedging/model.test.mjs tests/auth/model.test.mjs
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser to real C++ engine (no broker)
        env:
          DTS_SCREENSHOT_DIR: pricing-screenshots
        run: |
          python tests/pricing/browser_tests.py build-pricing/server
          python tests/greeks/browser_tests.py build-pricing/server
          python tests/storage/browser_tests.py build-pricing/server
          python tests/history/browser_tests.py build-pricing/server build-pricing/history_tests
          python tests/replay/browser_tests.py build-pricing/server build-pricing/research_store_tests
          python tests/sde/browser_tests.py build-pricing/server
          python tests/hedging/browser_tests.py build-pricing/server
          python tests/auth/browser_tests.py build-pricing/server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-lab-screenshots
          path: pricing-screenshots/
          if-no-files-found: ignore
          retention-days: 7
